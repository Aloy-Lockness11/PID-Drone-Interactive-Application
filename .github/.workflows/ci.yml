
name: C++ Build and Tests

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sfml
            mingw-w64-ucrt-x86_64-gtest

      - name: Configure CMake
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build application and tests
        run: cmake --build build-ci --parallel 2

      - name: Run unit tests
        run: ctest --test-dir build-ci --output-on-failure
